# Apache vhost per relay.gibisoft.net — dashboard HTTPS (proxy su 127.0.0.1:8484)
# Il relay TCP diretto per i client usa la porta 8474 (fuori da Apache).
<VirtualHost *:80>
    ServerName relay.gibisoft.net

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8484/
    ProxyPassReverse / http://127.0.0.1:8484/
    # WebSocket / SSE per il dashboard in tempo reale
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:8484/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/relay-error.log
    CustomLog ${APACHE_LOG_DIR}/relay-access.log combined
</VirtualHost>

# La sezione SSL su *:443 verrà generata automaticamente da:
#   sudo certbot --apache -d relay.gibisoft.net
